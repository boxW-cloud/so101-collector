<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>主臂 → Isaac 仿真 · 实时验证</title>
<style>body{margin:0;background:#111b24;color:#e9f1f6;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:24px auto;padding:0 24px}h1{margin:0;font-size:26px}p{color:#aec2cd}button,select{font:inherit;padding:9px 14px;border:1px solid #506579;border-radius:6px;color:#fff;background:#244c60;cursor:pointer}#pause{background:#984c36}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}video{width:100%;max-height:68vh;background:#080e13;object-fit:contain}#metrics{white-space:pre-wrap;color:#bbd7df}#error{color:#ffc28e}small{color:#99afbc}table{border-collapse:collapse}td,th{padding:3px 15px;border-bottom:1px solid #334652;text-align:right}</style>
<main><h1>主臂控制 Isaac 仿真</h1><p>COM15 手动示教 · ID2/3/4三点定位预览（待姿态验收） · 真实从臂不参与 · 尚未录制数据</p>
<div class="bar"><select id="camera"><option value="overview">全臂总览</option><option value="front">前视相机</option><option value="wrist">腕部相机</option></select><button id="connect">连接实时画面</button><button id="pause">暂停跟随</button><button id="align">继续跟随／重设ID1与ID5起点</button><span id="connection">等待 WebRTC</span></div>
<video id="video" autoplay muted playsinline controls></video><div id="error"></div><p id="metrics">正在读取状态</p><p id="inputhealth" role="status">正在检查主臂输入</p>
<table><thead><tr><th>关节</th><th>主臂编码</th><th>虚拟目标 °</th><th>虚拟反馈 °</th></tr></thead><tbody id="joints"></tbody></table>
<small>ID2肩、ID3肘、ID4腕俯仰使用新三点固定映射，不受旧±20°相对窗口限制；保留虚拟关节限位和30°/秒速率限制。ID1底座和未重采的ID5腕旋转仍按原相对映射、±20°窗口工作；夹爪保留原端点。暂停后继续时，三点轴会缓慢走向当前主臂对应位置。真实从臂不参与，尚未录制数据。</small></main>
<script>
let pc=null;const $=id=>document.getElementById(id);const names=['底座','肩','肘','腕俯仰','腕旋转','夹爪'];
async function connect(){ $('connect').disabled=true;try{if(pc)pc.close();pc=new RTCPeerConnection({iceServers:[]});pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=e=>{$('video').srcObject=new MediaStream([e.track]);$('video').play().catch(()=>{});};pc.onconnectionstatechange=()=>{$('connection').textContent='WebRTC '+pc.connectionState;};await pc.setLocalDescription(await pc.createOffer());if(pc.iceGatheringState!=='complete')await new Promise(resolve=>{let timer=setTimeout(resolve,5000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timer);resolve();}});});let r=await fetch('/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:pc.localDescription.sdp,type:pc.localDescription.type,camera:$('camera').value})});if(!r.ok)throw Error('WebRTC 连接失败 '+r.status);await pc.setRemoteDescription(await r.json());}catch(e){$('error').textContent=e.message;}finally{$('connect').disabled=false;}}
async function control(action){let r=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});if(!r.ok)$('error').textContent='控制请求失败';}
$('connect').onclick=connect;$('camera').onchange=connect;$('pause').onclick=()=>control('pause');$('align').onclick=()=>control('align');
async function refresh(){try{let s=await(await fetch('/status')).json();let f=0;if(pc)for(let v of (await pc.getStats()).values())if(v.type==='inbound-rtp'&&v.kind==='video')f=v.framesDecoded??0;let labels={STARTING:'场景加载中',FOLLOWING_RELATIVE:'主臂相对跟随中',FOLLOWING_THREE_POINT:'ID2/3/4三点定位跟随中',WAITING_LEADER_HOLD:'等待主臂输入／虚拟臂保持',PAUSED_HOLD:'已暂停／虚拟臂保持',FAILED:'仿真失败'};$('metrics').textContent=`${labels[s.state]??s.state}　输入序号 ${s.received_sequence??0}　输入帧龄 ${s.received_age_s??'—'} 秒　画面帧龄 ${s.camera_age_s?.[$('camera').value]??'—'} 秒　已解码 ${f} 帧`;$('inputhealth').textContent=s.input_reason==='WINDOW_EXPIRED'?'主臂读取窗口已结束：画面仍实时，但不会跟随。需要重新启动主臂读取。':(s.input_live?'主臂输入在线 · 剩余 '+(s.reader_remaining_s==null?'未知':Math.ceil(s.reader_remaining_s)+' 秒'):'主臂输入已中断／未启动：画面实时不代表主臂在线');$('inputhealth').style.color=s.input_live?'#8ce0be':'#ffc28e';$('error').textContent=s.error??((s.input_clamped_axes?.length)?'主臂超出已测输入范围：'+s.input_clamped_axes.join('、')+'。映射正在裁剪，当前不能保证姿态一致。':(s.relative_limit_axes?.length)?'ID1或ID5已到±20°相对边界，可暂停后重设起点。':'');$('joints').replaceChildren(...names.map((n,i)=>{let tr=document.createElement('tr');for(let v of [n,s.native_positions?.[String(i+1)]??'—',s.target_deg?.[i]?.toFixed(1)??'—',s.measured_deg?.[i]?.toFixed(1)??'—']){let td=document.createElement('td');td.textContent=v;tr.append(td);}return tr;}));}catch(e){$('metrics').textContent='连接状态服务中…';}}
refresh();setInterval(refresh,1000);connect();
</script></html>
